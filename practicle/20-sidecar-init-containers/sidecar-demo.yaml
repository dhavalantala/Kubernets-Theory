apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: dev-backend
  labels:
    app: sidecar-demo
spec:
  containers:
  - name: main-app
    image: busybox
    command: ["sh", "-c", "while true; do echo \"$(date): app log entry\" >> /logs/app.log; sleep 3; done"]
    volumeMounts:
    - name: log-volume
      mountPath: /logs
  - name: log-shipper
    image: busybox
    command: ["sh", "-c", "tail -f /logs/app.log"]
    volumeMounts:
    - name: log-volume
      mountPath: /logs
  volumes:
  - name: log-volume
    emptyDir: {}