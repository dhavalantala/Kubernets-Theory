apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: quota-buster
  namespace: dev-backend
spec: 
  replicas: 5
  selector: 
    matchLabels:
      app: quota-buster
  template:
    metadata:
      labels:
        app: quota-buster
    spec: 
      containers:
      - name: app 
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "300m"
            memory: "300Mi"
          limits: 
            cpu: "400m"
            memory: "400Mi"