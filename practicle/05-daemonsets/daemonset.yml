apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: daemonsets
  labels:
    app: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      containers:
      - name: logger
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo logging from $(hostname); sleep 30; done"]