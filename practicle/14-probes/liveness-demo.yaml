apiVersion: v1 
kind: Pod 
metadata:
  name: liveness-demo 
  namespace: dev-backend
  labels:
    app: liveness-demo
spec: 
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "touch /tmp/healthy && sleep 30 && rm /tmp/healthy && sleep 3600"]
    livenessProbe:
      exec:
        command: ["cat", "/tmp/healthy"]
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3