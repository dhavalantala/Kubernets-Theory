apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: readiness-demo
  namespace: dev-backend
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo
    spec: 
      containers:
      - name: app
        image: busybox
        command: ["sh", "-c", "touch /tmp/ready && sleep 3600"]
        readinessProbe:
          exec: 
            command: ["cat", "/tmp/ready"]
          initialDelaySeconds: 5
          periodSeconds: 5

--- 
apiVersion: v1 
kind: Service 
metadata:
  name: readiness-svc
  namespace: dev-backend
spec: 
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 80